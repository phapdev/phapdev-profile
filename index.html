<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>phapdev profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            base: "#0a0a1a",
            primary: "#00ffff",
            secondary: "#ff00ff",
            accent: "#ffffff",
          },
          fontFamily: {
            sans: ["Exo 2", "sans-serif"],
            mono: ["Space Grotesk", "monospace"],
          },
          keyframes: {
            fadeIn: {
              "0%": {opacity: "0"},
              "100%": {opacity: "1"},
            },
            pulseGlow: {
              "0%, 100%": {
                boxShadow:
                  "0 0 5px #00ffff, 0 0 10px #00ffff, 0 0 15px #ff00ff",
                opacity: "0.8",
              },
              "50%": {
                boxShadow:
                  "0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #ff00ff",
                opacity: "1",
              },
            },
          },
          animation: {
            fadeIn: "fadeIn 1s ease-in-out",
            pulseGlow: "pulseGlow 4s ease-in-out infinite",
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;700&family=Space+Grotesk:wght@400;500;700&display=swap"
    rel="stylesheet" />
  <!-- <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script> -->
  <!-- <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script> -->
  <!-- <script src="https://unpkg.com/framer-motion@10"></script> -->
  <!-- <script src="https://unpkg.com/lucide-react@0.292.0"></script> -->
  <style>
    body {
      background-color: #0a0a1a;
      color: #ffffff;
      font-family: "Exo 2", sans-serif;
    }

    .glassmorphism {
      background: rgba(10, 10, 26, 0.25);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 255, 255, 0.18);
    }

    .text-glow {
      text-shadow:
        0 0 8px #00ffff,
        0 0 10px #00ffff;
    }
  </style>
  <!-- <link rel="stylesheet" href="/index.css" /> -->
  <link rel="icon" type="image/png" href="./assets/farvicon.png" />
</head>

</body>

</html>
